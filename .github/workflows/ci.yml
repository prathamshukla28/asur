name: ASUR CI

# ASUR-LOCAL-01 / ASUR-FIREWALL-01 enforced in CI.
# No GPU, no network to models, no real model downloads here (G10): the stdlib
# core must install and import with ZERO third-party packages, and the firewall
# must leak no forbidden target names. Real model runs are local-only/manual.

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

# Least-privilege: this workflow only reads the repo (ASUR-LOCAL-01 — no remote
# auth, no writes, no network to models). No job needs more than read access.
permissions:
  contents: read

# One run per ref; a newer push cancels an in-flight run on the same ref.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  stdlib-firewall:
    name: stdlib-only core + firewall
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.3.0
        with:
          python-version: "3.12"
          cache: pip

      # Install the package with NO extras. If the stdlib core secretly needs a
      # media dep, this install + the import probe below will fail.
      - name: Install core (no extras)
        run: pip install .

      # ASUR-LOCAL-01: importing the stdlib layers must NOT pull in any heavy /
      # media / network dependency. Snapshot sys.modules before and after and
      # assert none of the forbidden set appeared. Stronger than try/except:
      # it catches an accidental top-level import anywhere in the import graph.
      - name: Assert stdlib-only core (no forbidden deps leak)
        run: |
          python - <<'PY'
          import sys
          before = set(sys.modules)
          import asur, asur.core, asur.script, asur.orchestrator, asur.tools, asur.viral_check, asur.learning  # noqa: F401
          import asur.llm, asur.cli, asur.viral_check.probe  # noqa: F401
          after = set(sys.modules)
          forbidden = {
              "torch", "diffusers", "transformers", "kokoro", "soundfile",
              "numpy", "PIL", "cv2", "opentimelineio", "moviepy", "librosa",
              "faster_whisper", "stable_audio_tools",
              "requests", "httpx", "aiohttp", "urllib3", "anthropic",
          }
          leaked = sorted(forbidden & {m.split(".")[0] for m in after - before})
          if leaked:
              print("FORBIDDEN DEPENDENCIES LEAKED INTO STDLIB CORE:", leaked)
              sys.exit(1)
          print("stdlib-only core OK: no forbidden dependency imported.")
          PY

      # ASUR-FIREWALL-01: VIRAL_VIEW strips quality/hardness TARGETS by name.
      # Fail the build if a forbidden target field name appears outside its own
      # definition in the firewall projection module. (Source-level grep guard;
      # the test suite also asserts this behaviourally.)
      - name: Firewall grep guard (no target-name leak)
        run: |
          if grep -rInE 'quality_targets|hardness_targets|target_score|per_dimension_target|what_good_is|quality_floors' \
              --include='*.py' asur/generation asur/editing asur/viral_check; then
            echo "FIREWALL LEAK: a forbidden target field name appears in a generation/editing/viral path."
            exit 1
          fi
          echo "Firewall grep guard OK."

  lint-type-test:
    name: ruff + mypy + pytest (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # requires-python is >=3.10, so the whole supported range is tested, not
        # just one version.
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.3.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      # Dev tools are pinned in the [dev] extra so the lint/type/test rule sets
      # are reproducible and cannot drift when a new ruff/mypy/pytest is released.
      # The package itself stays stdlib-only.
      - name: Install core + pinned dev tools
        run: pip install ".[dev]"

      - name: Ruff
        run: ruff check .

      - name: Mypy
        run: mypy asur   # blocking type gate for the ASUR core package

      # Default addopts excludes the `integration` marker: stdlib unit suite only
      # (no GPU, no network). Tests that need the ffmpeg binary skip without it.
      - name: Pytest (unit suite)
        run: pytest -q

  ffmpeg-integration:
    name: real FFmpeg render + measured viral check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.3.0
        with:
          python-version: "3.12"
          cache: pip
      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Install core + pinned dev tools
        run: pip install ".[dev]"
      # The SDXL test self-skips without the [generation] extra (no torch here).
      - name: Pytest (integration tier + ffmpeg-backed unit tests)
        run: pytest -q -m integration && pytest -q
      - name: End-to-end demo (script -> render -> viral check -> publish gate)
        run: |
          mkdir -p /tmp/asur-demo
          asur run --project /tmp/asur-demo --idea "why most people waste money on AI tools" \
            --takeaway "list every AI subscription you pay for and cancel the ones that use the same underlying model" \
            --self-approve || test $? -eq 1
          ls -la /tmp/asur-demo/youtube/*/render/
