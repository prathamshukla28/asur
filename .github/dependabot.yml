version: 2
updates:
  # Keep the GitHub Actions used by the workflows current (they are SHA-pinned,
  # so Dependabot bumps the SHA + comment together).
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore(ci)"
    open-pull-requests-limit: 5

  # Watch the pinned dev tools and the optional `generation` extra in
  # pyproject.toml. The stdlib core has no runtime dependencies (ASUR-LOCAL-01),
  # so there is nothing else here to track.
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore(deps)"
    open-pull-requests-limit: 5
