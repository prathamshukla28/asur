[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "asur"
version = "0.1.0"
description = "ASUR - a local-first content pipeline: idea -> script -> FFmpeg render -> measured viral check -> publish gate."
readme = "README.md"
requires-python = ">=3.10"
# Zero runtime dependencies: the core, SCRIPT, VIRAL CHECK, ORCHESTRATOR, and
# FIREWALL layers import ONLY the standard library (see ADR-0002). The optional
# LLM step talks to a local Ollama server over stdlib urllib (asur/llm/adapters),
# and the optional Anthropic provider lazy-imports the `anthropic` package from
# the `llm` extra below. This list MUST stay empty.
dependencies = []

# Media/generation path only. Declared here so `pip install -e .[generation]`
# can pull them, but the stdlib core NEVER imports these (ADR-0002, ADR-0004).
# A stdlib-only install must still run SCRIPT + VIRAL CHECK + orchestration.
# Pinned to known-good versions for a reproducible install (SPEC-GAP G28).
# Heavy model weights (Wan 2.2, SDXL, Kokoro, Stable Audio) and ComfyUI are
# installed/managed separately, outside pip — see docs/GENERATION_STACK.md.
# Enabling this extra pulls torch + multi-GB weights; that is a human-gated,
# opt-in action (ASUR-HUMAN-01). The stdlib core never imports any of these.
[project.optional-dependencies]
generation = [
    "moviepy==2.2.1",            # MIT - FFmpeg-backed editing/compositing
    "faster-whisper==1.2.1",     # MIT - word-level caption timing (no network at runtime)
    "librosa==1.0.0",            # ISC - beat map / audio analysis
    "opentimelineio==0.18.1",    # Apache-2.0 - timeline interchange (OTIO)
    "torch==2.14.1",             # BSD-3 - tensor runtime (MPS on Apple Silicon, else CPU)
    "diffusers==0.41.0",         # Apache-2.0 - SDXL image pipeline (OpenRAIL++-M weights)
    "transformers==5.20.2",      # Apache-2.0 - SDXL text encoders
    "accelerate==1.15.0",        # Apache-2.0 - diffusers device placement
    "safetensors==0.8.0",        # Apache-2.0 - weight format SDXL loads from
    "Pillow==11.3.0",            # HPND/MIT-CMU - resize/crop generated frame to 1080x1920
    "kokoro==0.9.4",             # Apache-2.0 - Kokoro-82M voice synthesis
    "soundfile==0.14.0",         # BSD-3 - Kokoro 24kHz WAV writing
    "numpy==2.5.1",              # BSD-3 - audio buffer concatenation
    "stable-audio-tools==0.0.20",# Stable Audio Community - music generation
    "torchaudio==2.11.0",        # BSD-2 - Stable Audio 44.1kHz WAV writing
]

# Optional hosted-LLM provider for the SCRIPT stages (ASUR_LLM=anthropic). The
# local Ollama provider needs no package at all. Never imported by the core.
llm = [
    "anthropic>=0.40",
]

# Developer / CI tooling. Pinned so lint, type-check, and test runs are
# reproducible: a fresh `pip install ruff` in CI pulls whatever released last and
# can change the rule set out from under the build (it did). The package itself
# stays stdlib-only (ASUR-LOCAL-01); these are test/CI-time only, never imported
# by the core.
dev = [
    "ruff==0.16.10",
    "mypy==2.4.0",
    "pytest==9.1.1",
]

[project.scripts]
asur = "asur.cli:main"

[tool.ruff]
# Explicit, version-independent lint config. Without this, ruff's built-in
# default rule set changes between releases, so a `pip install ruff` in CI could
# pass one week and fail the next (it did). Pinning
# the rule set here plus a pinned ruff in the `dev` extra makes lint deterministic
# everywhere (local, CI, contributors), independent of ruff version or any
# machine-level user config.
target-version = "py310"
src = ["."]

[tool.ruff.lint]
# ruff's historical default working set (pyflakes + the import/logic pycodestyle
# rules), made explicit, plus RUF100 so stale `# noqa` directives are caught.
# E501 (line-too-long) is intentionally NOT enforced — the codebase does not wrap
# at a fixed column and never has.
select = ["E4", "E7", "E9", "F", "I", "RUF100"]

[tool.mypy]
# Blocking type gate for the stdlib-only core and the asur package (CI runs
# `mypy asur`). Optional media deps (torch, diffusers, opentimelineio, ...) live
# behind asur[generation] and are lazy-imported, so ignore their missing stubs.
python_version = "3.10"
ignore_missing_imports = true

[tool.setuptools.packages.find]
where = ["."]
include = ["asur*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Opt-in real-render tier. Default `pytest` skips it via addopts; run it with
# `pytest -m integration`. These tests shell out to the ffmpeg binary and are
# skipped automatically when ffmpeg is absent (keeps the unit suite no-network,
# no-GPU, and count-stable — see docs/build/PHASES.md P04/G10).
markers = [
    "integration: real-render pipeline test; needs the ffmpeg binary; opt-in only",
]
addopts = "-m 'not integration'"
